[project]
name = "noisy-room"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fast: file-only and deterministic tests with no external CLI calls",
    "cli_smoke: external CLI discovery tests that do not call a model",
    "live_codex: model-backed Codex CLI behavior tests",
]
